[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpaxe"
version = "0.1.0"
description = "Weigh your MCP config. Chop the context tax — audit the token cost of every MCP server and tool, find the ones you never use, and generate a slim config."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "20000419" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "llm",
    "tokens",
    "context-window",
    "claude",
    "cursor",
    "windsurf",
    "claude-code",
    "cli",
    "audit",
    "cost",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = ["rich>=13.0", "tiktoken>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
mcpaxe = "mcpaxe.cli:main"

[project.urls]
Homepage = "https://github.com/20000419/mcpaxe"
Repository = "https://github.com/20000419/mcpaxe"
Issues = "https://github.com/20000419/mcpaxe/issues"
Changelog = "https://github.com/20000419/mcpaxe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
